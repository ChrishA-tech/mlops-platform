[project]
name = "mlops-platform"
version = "0.1.0"
description = "End-to-end MLOps platform: validation, feature pipeline, HPO, tracking/registry, serving, drift monitoring, CI/CD, IaC"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0", "numpy>=1.26", "scikit-learn>=1.3", "lightgbm>=4.0", "xgboost>=2.0",
    "optuna>=3.4", "mlflow>=2.10", "pandera>=0.18", "pyyaml>=6.0", "joblib",
    "fastapi>=0.110", "uvicorn", "pydantic>=2", "prometheus-client", "scipy",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx"]
spark = ["pyspark>=3.5"]
drift = ["evidently>=0.4"]
orchestration = ["prefect>=2.14"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
